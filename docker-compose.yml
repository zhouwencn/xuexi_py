services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xuexi_py}
      POSTGRES_USER: ${POSTGRES_USER:-xuexi_py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xuexi_py}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - xuexi_py_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xuexi_py_postgres_data:
